name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.1.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.3.0

      - name: Install dependencies
        run: npm ci

      - name: Install Electron desktop runtime
        run: npm run desktop:install

      - name: Lint, typecheck, unit tests, and build
        run: npm run check

      - name: Electron end-to-end test
        run: npx playwright test --config=playwright.config.ts
